{{- /*
One statefulset per zone when zone-aware replication is enabled, a single one otherwise.
The no-zone case iterates once over an empty dict, which `if .zone` treats as unset.
*/ -}}
{{- $zones := list dict }}
{{- if .Values.worker.zoneAwareReplication.enabled }}
{{- if not .Values.worker.zoneAwareReplication.zones }}
{{- fail "worker.zoneAwareReplication.enabled is true but worker.zoneAwareReplication.zones is empty" }}
{{- end }}
{{- $zones = .Values.worker.zoneAwareReplication.zones }}
{{- end }}
{{- range $index, $zone := $zones }}
{{- if $index }}
---
{{- end }}
{{- /* Render the body against a context carrying the zone, so `.` keeps working below. */}}
{{- with dict "Values" $.Values "Release" $.Release "Chart" $.Chart "Capabilities" $.Capabilities "Template" $.Template "Files" $.Files "zone" $zone }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "celeborn.worker.statefulSet.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "celeborn.worker.labels" . | nindent 4 }}
spec:
  replicas: {{ include "celeborn.worker.replicas" . }}
  selector:
    matchLabels:
      {{- include "celeborn.worker.selectorLabels" . | nindent 6 }}
  {{- with .Values.worker.volumeClaimTemplates }}
  volumeClaimTemplates:
  {{- toYaml . | nindent 2 }}
  {{- end }}
  serviceName: {{ include "celeborn.worker.service.name" . }}
  template:
    metadata:
      labels:
        {{- include "celeborn.worker.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/tag: {{ .Values.image.tag | quote }}
      annotations:
        celeborn.apache.org/conf-hash: {{ include "celeborn.configChecksum" . }}
        {{- with .Values.worker.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- /* Add an init container to chown mount paths of Celeborn workers volume if necessary. */}}
      {{- $paths := list }}
      {{- range $volumeMount := .Values.worker.volumeMounts }}
      {{- range $volume := $.Values.worker.volumes }}
      {{- if eq $volume.name $volumeMount.name }}
      {{- if or $volume.hostPath $volume.emptyDir }}
      {{- $paths = append $paths $volumeMount.mountPath }}
      {{- end }}
      {{- end }}
      {{- end }}
      {{- end }}
      {{- if or .Values.worker.extraInitContainers $paths }}
      initContainers:
      {{- end }}
      {{- with .Values.worker.extraInitContainers }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- if $paths }}
      - name: chown-celeborn-worker-volume
        image: {{ include "celeborn.image" . }}
        {{- with .Values.image.pullPolicy }}
        imagePullPolicy: {{ . }}
        {{- end }}
        command:
        - chown
        - -R
        - {{ .Values.worker.podSecurityContext.runAsUser | default 10006 }}:{{ .Values.worker.podSecurityContext.runAsGroup | default 10006 }}
        {{- range $path := $paths }}
        - {{ $path }}
        {{- end }}
        {{- with .Values.worker.volumeMounts }}
        volumeMounts:
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.worker.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        securityContext:
          runAsUser: 0
      {{- end }}
      containers:
      - name: {{ .Chart.Name }}
        image: {{ include "celeborn.image" . }}
        {{- with .Values.image.pullPolicy }}
        imagePullPolicy: {{ . }}
        {{- end }}
        command:
        - /usr/bin/tini
        - --
        - /bin/sh
        - -c
        {{- $namespace := .Release.Namespace }}
        - >
          until {{ range until (.Values.master.replicas | int) }}
          nslookup {{ include "celeborn.master.statefulSet.name" $ }}-{{ . }}.{{ include "celeborn.master.service.name" $ }}.{{ $namespace }}.svc.{{ $.Values.cluster.name }}.local &&
          {{- end }}
          true; do
            echo "waiting for master";
            sleep 2;
          done && exec /opt/celeborn/sbin/start-worker.sh
        ports:
        - containerPort: {{ get .Values.celeborn "celeborn.worker.http.port" | default 9096 }}
          name: metrics
          protocol: TCP
        {{- $drain := and .Values.worker.autoscaling.enabled .Values.worker.autoscaling.drain.enabled }}
        {{- if or $drain .Values.worker.env }}
        env:
        {{- if $drain }}
        {{- /* Not $HOSTNAME: with worker.hostNetwork that is the node name, whose trailing
        number would be read as an ordinal and decommission the worker on every rollout. */}}
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        {{- end }}
        {{- with .Values.worker.env }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
        {{- with .Values.worker.envFrom }}
        envFrom:
        {{- toYaml . | nindent 8 }}
        {{- end }}
        volumeMounts:
        - name: celeborn-conf
          subPath: celeborn-defaults.conf
          mountPath: /opt/celeborn/conf/celeborn-defaults.conf
        - name: celeborn-conf
          subPath: log4j2.xml
          mountPath: /opt/celeborn/conf/log4j2.xml
        - name: celeborn-conf
          subPath: metrics.properties
          mountPath: /opt/celeborn/conf/metrics.properties
        {{- with .Values.worker.volumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if $drain }}
        {{- /*
        A scale-in must decommission (wait for the shuffle data to expire); a rollout or a
        node drain must not, or every pod replacement would block for hours. The pod tells
        them apart by its own ordinal: the statefulset controller lowers `spec.replicas`
        before deleting pods on a scale-in, so an ordinal at or above the desired count is
        being removed for good. Anything unreadable falls back to a graceful shutdown.
        */}}
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - |
                set -u
                SA=/var/run/secrets/kubernetes.io/serviceaccount
                STS={{ include "celeborn.worker.statefulSet.name" . }}
                # preStop output is not collected, so log through the main process.
                log() { echo "celeborn preStop: $*" >/proc/1/fd/1 2>/dev/null || echo "celeborn preStop: $*"; }
                ORDINAL=${POD_NAME:-}
                ORDINAL=${ORDINAL##*-}
                DESIRED=""
                if [ -r "$SA/token" ]; then
                  URL="https://kubernetes.default.svc/apis/apps/v1/namespaces/$(cat $SA/namespace)/statefulsets/$STS/scale"
                  AUTH="Authorization: Bearer $(cat $SA/token)"
                  if command -v curl >/dev/null 2>&1; then
                    SCALE=$(curl -sS --cacert "$SA/ca.crt" -H "$AUTH" "$URL" 2>/dev/null)
                  else
                    SCALE=$(wget -q -O - --ca-certificate="$SA/ca.crt" --header="$AUTH" "$URL" 2>/dev/null)
                  fi
                  DESIRED=$(printf '%s' "$SCALE" | sed 's/"status".*//' | grep -o '"replicas":[0-9 ]*' | head -n 1 | tr -dc '0-9')
                fi
                case "$ORDINAL" in ''|*[!0-9]*) ORDINAL="" ;; esac
                case "$DESIRED" in ''|*[!0-9]*) DESIRED="" ;; esac
                EXIT_TYPE=GRACEFUL
                if [ -n "$ORDINAL" ] && [ -n "$DESIRED" ] && [ "$ORDINAL" -ge "$DESIRED" ]; then
                  EXIT_TYPE=DECOMMISSION
                fi
                if [ -z "$DESIRED" ]; then
                  log "could not read $STS desired replicas - a scale-in will NOT decommission"
                fi
                log "ordinal=${ORDINAL:-unknown} desired=${DESIRED:-unknown} exit=$EXIT_TYPE"
                BODY='{"type":"'"$EXIT_TYPE"'"}'
                EXIT_URL="http://127.0.0.1:{{ get .Values.celeborn "celeborn.worker.http.port" | default 9096 }}/api/v1/workers/exit"
                if command -v curl >/dev/null 2>&1; then
                  curl -sS -f -X POST -H 'Content-Type: application/json' -d "$BODY" "$EXIT_URL" >/dev/null
                else
                  wget -q -O /dev/null --header='Content-Type: application/json' --post-data="$BODY" "$EXIT_URL"
                fi
                if [ $? -eq 0 ]; then
                  # Hold the pod open while the worker drains. It exits on its own once done,
                  # and terminationGracePeriodSeconds bounds the wait.
                  while :; do sleep 5; done
                else
                  log "exit request failed, falling through to SIGTERM"
                fi
        {{- end }}
        {{- with .Values.worker.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.worker.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      - name: celeborn-conf
        configMap:
          name: {{ include "celeborn.configMap.name" . }}
          defaultMode: 0444
          items:
          - key: celeborn-defaults.conf
            path: celeborn-defaults.conf
          - key: log4j2.xml
            path: log4j2.xml
          - key: metrics.properties
            path: metrics.properties
      {{- with .Values.worker.volumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- $nodeSelector := merge (deepCopy (default dict (and .zone .zone.nodeSelector))) (default dict .Values.worker.nodeSelector) }}
      {{- with $nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $affinity := .Values.worker.affinity }}
      {{- if and .zone .zone.affinity }}
      {{- $affinity = .zone.affinity }}
      {{- end }}
      {{- with $affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.worker.priorityClass.name .Values.worker.priorityClass.create }}
      priorityClassName: {{ include "celeborn.worker.priorityClass.name" . }}
      {{- end }}
      {{- with .Values.worker.dnsPolicy }}
      dnsPolicy: {{ . }}
      {{- end }}
      {{- with .Values.worker.hostNetwork }}
      hostNetwork: {{ . }}
      {{- end }}
      serviceAccountName:  {{ include "celeborn.serviceAccount.name" . }}
      {{- with .Values.worker.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
{{- end }}
{{- end }}
